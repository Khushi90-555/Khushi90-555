name: Generate contribution snake
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Khushi90-555
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=#ec4899
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#d946ef
      - name: Push snake to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
          branch: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
